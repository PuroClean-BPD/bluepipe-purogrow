<style>
  :root {
    --navy: #0B1120;
    --navy-2: #111827;
    --blue: #3B82F6;
    --blue-2: #2563EB;
    --muted: #94A3B8;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.10);
    --err: #F87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Poppins, system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(59,130,246,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(37,99,235,0.12), transparent 55%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px 28px;
    backdrop-filter: blur(10px);
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .logo { height: 36px; width: auto; display: block; margin: 0 auto 22px; }
  h1 {
    font-family: Montserrat, Poppins, sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 24px;
    line-height: 1.45;
  }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #CBD5E1;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-family: inherit;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    outline: none;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--blue), var(--blue-2));
    color: #fff;
    font-family: Montserrat, Poppins, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  .err {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(248,113,113,0.12);
    border: 1px solid rgba(248,113,113,0.35);
    color: #FECACA;
    font-size: 0.88rem;
    text-align: center;
  }
  .err.show { display: block; }
  .foot {
    margin-top: 22px;
    text-align: center;
    color: #64748B;
    font-size: 0.75rem;
  }
  .busy {
    display: none;
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .busy.show { display: block; }
</style>
</head>

    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);

      if (!res.ok) throw new Error("Missing payload " + name);
      parts.push(await res.text());

    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]

    const iv = b64ToBytes(payloadMeta.iv_b64);
