<style>
  :root {
    --navy: #0B1120;
    --navy-2: #111827;
    --blue: #3B82F6;
    --blue-2: #2563EB;
    --muted: #94A3B8;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.10);
    --err: #F87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Poppins, system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(59,130,246,0.18), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(37,99,235,0.12), transparent 55%),
      linear-gradient(160deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 36px 32px 28px;
    backdrop-filter: blur(10px);
    box-shadow: 0 24px 60px rgba(0,0,0,0.35);
  }
  .logo { height: 36px; width: auto; display: block; margin: 0 auto 22px; }
  h1 {
    font-family: Montserrat, Poppins, sans-serif;
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }
  .sub {
    text-align: center;
    color: var(--muted);
    font-size: 0.92rem;
    margin: 0 0 24px;
    line-height: 1.45;
  }
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: #CBD5E1;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(0,0,0,0.35);
    color: #fff;
    font-family: inherit;
    font-size: 1.05rem;
    letter-spacing: 0.08em;
    outline: none;
  }
  input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(59,130,246,0.25); }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 14px 16px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(180deg, var(--blue), var(--blue-2));
    color: #fff;
    font-family: Montserrat, Poppins, sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  button:hover:not(:disabled) { filter: brightness(1.06); }
  .err {
    display: none;
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    background: rgba(248,113,113,0.12);
    border: 1px solid rgba(248,113,113,0.35);
    color: #FECACA;
    font-size: 0.88rem;
    text-align: center;
  }
  .err.show { display: block; }
  .foot {
    margin-top: 22px;
    text-align: center;
    color: #64748B;
    font-size: 0.75rem;
  }
  .busy {
    display: none;
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.88rem;
  }
  .busy.show { display: block; }
</style>
</head>

  async function fetchChunks(names) {
    const parts = [];
    for (const name of names) {
      const res = await fetch(name, { cache: "no-store" });
      if (!res.ok) throw new Error("Missing payload " + name);
      parts.push(await res.text());
    }
    return parts.join("");
  }

  async function deriveKey(password, salt, iterations) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
      baseKey,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }

  async function decryptPayload(password, payloadMeta, chunkNames) {
    const salt = b64ToBytes(payloadMeta.salt_b64);
    const iv = b64ToBytes(payloadMeta.iv_b64);
    const key = await deriveKey(password, salt, payloadMeta.iterations);
    const cipherB64 = await fetchChunks(chunkNames);
    const cipher = b64ToBytes(cipherB64);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, cipher);
    return new Uint8Array(plain);
  }

  function showError(msg) {
    const err = document.getElementById("err");
    err.textContent = msg || "That code didn’t unlock this audit. Check the code and try again.";
    err.classList.add("show");
    document.getElementById("busy").classList.remove("show");
    document.getElementById("btn").disabled = false;
  }

  async function unlock(password, remember) {
    document.getElementById("err").classList.remove("show");
    document.getElementById("busy").classList.add("show");
    document.getElementById("btn").disabled = true;
    try {
      const htmlBytes = await decryptPayload(password, META.html, META.html_chunks);
      const pdfBytes = await decryptPayload(password, META.pdf, META.pdf_chunks);
      const html = new TextDecoder("utf-8").decode(htmlBytes);
      const pdfBlob = new Blob([pdfBytes], { type: "application/pdf" });
      const pdfUrl = URL.createObjectURL(pdfBlob);
      if (remember) {
        try { sessionStorage.setItem(STORAGE_KEY, password); } catch (_) {}
      }
      // Replace relative PDF links with the decrypted blob before writing.
      const patched = html
        .replace(/href=(["'])audit\.pdf\1/gi, 'href="' + pdfUrl + '"')
        .replace(/href=(["'])\.\/audit\.pdf\1/gi, 'href="' + pdfUrl + '"');
      // Full document replacement so embedded scripts (lightbox) run normally.
      document.open();
      document.write(patched);
      document.close();
    } catch (e) {
      console.warn("Unlock failed", e);
      try { sessionStorage.removeItem(STORAGE_KEY); } catch (_) {}
      showError();
    }
  }

  document.getElementById("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    const code = (document.getElementById("code").value || "").trim();
    if (!code) return;
    unlock(code, true);
  });

  // Auto-unlock from sessionStorage on reload.
  try {
    const saved = sessionStorage.getItem(STORAGE_KEY);
    if (saved) unlock(saved, true);
  } catch (_) {}
})();
</script>
